# Drop-in for ros2-publishers-boot.service: the bringup arguments depend on
# the operating mode (written by `tractor-mode` to /etc/tractor/mode.env).
#   installed as /etc/systemd/system/ros2-publishers-boot.service.d/mode.conf
# Without mode.env (or BRINGUP_ARGS empty) this is the plain recording bringup.
[Service]
EnvironmentFile=-/etc/tractor/mode.env
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/humble/setup.bash && source /mnt/ros2_ws/install/setup.bash && exec ros2 launch tractor_bringup tractor_bringup.launch.py $${BRINGUP_ARGS}'
# ros2 launch shuts its nodes down on SIGINT; tractor_multi_cam_publisher can
# hang in GStreamer, so systemd SIGKILLs whatever is left after 20 s.
KillSignal=SIGINT
TimeoutStopSec=20
